<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <main class="container-one">
        <p class="eyebrow">LIFETRACKER</p>
        <h1>Daily thoughts, kept close.</h1>
        <p>Write a diary entry and keep it safely connected to your Telegram account.</p>
        <div class="buttons">
            <button id="seeBtn" type="button">See diaries</button>
            <button id="write-BTN" type="button">New diary</button>
        </div>
    </main>

    <div class="Auth-wind hidden">
        <div class="auth-container">
            <button id="login" class="tab-btn">login</button>
            <button id="register" class="tab-btn">register</button>
        </div>
    </div>

    <div class="auth-form hidden">
        <form id="id-form">
               <div class="input-group">
                     <label for="Authemail">Email or Username</label>
                     <input type="text" id="Authemail"  placeholder="e.g. mr_x" required>
               </div>

               <div class="input-group">
                    <label for="Authpassword">Password</label>
                    <input type="password" id="Authpassword" placeholder="......" required>  
               </div>

               <div class="input-group hidden">
                    <label for="AuthConfirmPassword">Confirm Password</label>
                    <input type="password" id="AuthConfirmPassword" placeholder="......">
               </div>

               <div class="btn-group">
                  <button type="submit">Sign in</button>
                  <button type="button"> cancel</button>
               </div>
        </form>
    </div>

    <section id="posts" class="hidden" aria-live="polite">
        <div class="section-heading">
            <div>
                <p class="eyebrow">YOUR ARCHIVE</p>
                <h2>Saved diaries</h2>
            </div>
            <button id="go-back" type="button" class="secondary-button">Home</button>
        </div>
        <div id="posts-status"></div>
    </section>

    <section class="form hidden">
        <form id="qu">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">NEW ENTRY</p>
                    <h2>Write a diary</h2>
                </div>
            </div>
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Give this day a name" maxlength="120" required>

            <label for="blog">What is on your mind?</label>
            <textarea name="blog" id="blog" placeholder="Write freely..." maxlength="10000" required></textarea>

            <div class="btn-group">
                <button type="submit">Save diary</button>
                <button type="button" id="cancelBtn">cancel</button>
            </div>
        </form>
    </section>

    <script src="main.js"></script>
</body>
</html>
